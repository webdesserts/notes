[workspace]
resolver = "2"
members = [
    "crates/notes-sync",
    "crates/notes-core",
    "crates/semantic-embeddings",
    "crates/sync-daemon",
    "crates/desktop",
    "crates/vault-sync",
]

[workspace.package]
version = "0.6.3"
edition = "2024"
authors = ["Michael Mullins"]
license = "Apache-2.0"
repository = "https://github.com/webdesserts/notes"

[workspace.dependencies]
# Utilities
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Async
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
futures = "0.3"

# CRDT (for sync crates)
loro = "1.13"

# Portable content hashing (deterministic across machines — pure-Rust, no SIMD/iroh deps)
blake3 = "1"

# Serialization (for sync crates)
serde_yaml = "0.9"
bincode = "1.3"
toml = "0.8"

# Error handling
thiserror = "2"

# CLI
clap = { version = "4", features = ["derive"] }

# HTTP server
axum = "0.8"

# File watching
notify = "8"
notify-debouncer-mini = "0.6"

# Cross-platform time (works in WASM)
web-time = "1"

# UUID generation (v4 random, js for WASM compatibility)
uuid = { version = "1", features = ["v4", "js"] }

# Random number generation (for peer ID generation)
rand = "0.9"

# Testing
tempfile = "3"

# P2P transport (iroh endpoint, mDNS discovery, pairing, gossip), extracted to its own repo.
# For cross-repo work, add an uncommitted `[patch."https://github.com/webdesserts/p2p-core"]`
# `p2p-core = { path = "../p2p-core" }` override in .cargo/config.toml.
p2p-core = { git = "https://github.com/webdesserts/p2p-core.git", tag = "v0.1.1" }

# XDG config/state paths + atomic 0600 writes (shared with mesh)
app-config = { git = "https://github.com/webdesserts/app-config.git", tag = "v0.1.0" }
