[package]
name = "sync-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "sync-daemon"
path = "src/main.rs"

[dependencies]
# Peer identity + file-backed key storage (FileKeyStorage, IdentityKey).
p2p-core = { path = "../p2p-core" }
# vault-sync's default `network` feature carries the iroh sync seam (SyncNode,
# gossip, PeerRegistry); `--no-default-features` is the pure Loro + FileSystem core.
vault-sync = { path = "../vault-sync" }
notes-core = { path = "../notes-core" }
tokio.workspace = true
bincode.workspace = true
async-trait.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# File watching
notify.workspace = true
notify-debouncer-mini.workspace = true

# CLI
clap.workspace = true

# Health endpoint HTTP server
axum.workspace = true

# File locking (flock-based daemon lock)
fs2 = "0.4"

# Hostname for device name detection
gethostname = "0.4"

# Document UUIDs — captured on the delete half of a move so the move-coalescer
# journal can re-stitch lineage on crash recovery (P4f-2).
uuid = { workspace = true, features = ["serde"] }

# Cancellation tokens for daemon shutdown (shared between prod and tests)
tokio-util = { version = "0.7", features = ["rt"] }

[package.metadata.dist]
dist = false

[dev-dependencies]
reqwest = "0.13.2"
tempfile.workspace = true
axum.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
# Iroh is not a dependency of sync-daemon in any section. The integration tests
# name iroh transport types through `p2p-core`'s `test-util` re-exports
# (`MemoryLookup`, `EndpointId`, etc.); the `_for_test` raw handles reach iroh's
# inherent methods via their return types. iroh / iroh-gossip arrive only
# transitively through p2p-core. (The `"iroh_gossip::net=debug"` env-filter
# strings in this suite are tracing target names, not crate references.)
bincode.workspace = true
anyhow.workspace = true
# `test-util` exposes SyncNode::new_relay_only_with_sync_handler for the
# off-LAN/NAT repro tests (it also turns on p2p-core/test-util). Cargo unifies this
# with the production [dependencies] entry, so it only affects test builds.
vault-sync = { path = "../vault-sync", features = ["test-util"] }
