[package]
name = "desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sync-daemon = { path = "../sync-daemon" }
notes-core = { path = "../notes-core" }
# Shared notes MCP HTTP server + `notes` CLI (argv[0] dispatch). `sync` adds no
# crates: desktop already depends on sync-daemon directly.
notes-sync = { path = "../notes-sync", default-features = false, features = ["sync"] }
app-config.workspace = true
axum.workspace = true
libc = "0.2"
rand.workspace = true
toml.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tokio.workspace = true
tokio-util.workspace = true
anyhow.workspace = true
tracing.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
