[package]
name = "desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
# Exclude from cargo-dist builds — this crate uses Tauri's own bundling pipeline.
[package.metadata.dist]
dist = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sync-daemon = { path = "../sync-daemon" }
memory-common = { path = "../memory-common" }
# Shared notes MCP HTTP server, run in-process (sync feature off: desktop runs sync-daemon itself)
memory = { path = "../memory", default-features = false }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
tokio.workspace = true
tokio-util.workspace = true
anyhow.workspace = true
tracing.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
