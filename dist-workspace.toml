[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.30.3"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "webdesserts/homebrew-tap"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Features to pass to cargo build
features = ["embedded-model", "sync"]
# Whether default-features should be enabled with cargo build
default-features = false
# Build dist-eligible packages individually (`cargo build -p <pkg>`) instead of
# `--workspace`, so the non-dist `desktop`/`sync-daemon` crates (dist = false)
# are never compiled — `desktop`'s GTK/Tauri deps break the cross-target builds.
precise-builds = true
# The release workflow is hand-augmented with a `build-desktop-dmg` job that dist
# doesn't generate; tell dist not to enforce ci-file freshness against it.
allow-dirty = ["ci"]
# Custom build setup to download model before building
github-build-setup = "../build-setup.yml"

# GitHub retired the macos-14 runner images on 2026-11-02; dist 0.30.3 still
# defaults aarch64-apple-darwin to macos-14, which cancels the job at start.
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"

